<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – BYWEALTH INVEST</title>
    <meta name="description" content="Securely log in to your BYWEALTH INVEST account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="CSS/style.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#0a0a0a', 'navy-light': '#141414', gold: '#d4af37', green: '#10B981' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="bg-navy text-slate-100 min-h-screen flex flex-col">

    <!-- Minimal Header -->
    <header class="border-b border-white/10">
        <div class="container flex items-center justify-between h-16">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gold flex items-center justify-center text-navy font-bold text-sm">BW
                </div>
                <span class="font-semibold tracking-tight">BYWEALTH <span class="text-gold">INVEST</span></span>
            </a>
            <a href="register.html" class="text-sm text-slate-400 hover:text-gold transition">Create Account</a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center py-12 px-4">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-2xl md:text-3xl font-bold mb-2">Welcome back</h1>
                <p class="text-slate-400 text-sm">Sign in to access your portfolio</p>
            </div>

            <div class="card border border-white/10">
                <form id="login-form" class="space-y-5">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1.5">Email Address</label>
                        <input type="email" id="email" required
                            class="w-full px-4 py-3 rounded-lg bg-navy border border-white/10 focus:border-gold outline-none transition text-sm"
                            placeholder="you@example.com" />
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="text-sm text-slate-400">Password</label>
                            <a href="forgot-password.html" class="text-xs text-gold hover:underline">Forgot
                                password?</a>
                        </div>
                        <input type="password" id="password" required
                            class="w-full px-4 py-3 rounded-lg bg-navy border border-white/10 focus:border-gold outline-none transition text-sm"
                            placeholder="••••••••" />
                    </div>

                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="remember" class="accent-gold rounded" />
                        <label for="remember" class="text-sm text-slate-400">Remember me</label>
                    </div>

                    <button type="submit" class="w-full btn-gold py-3.5 text-sm">
                        Sign In
                    </button>
                </form>

                <div class="mt-6 pt-6 border-t border-white/10 text-center text-sm text-slate-400">
                    Don’t have an account?
                    <a href="register.html" class="text-gold hover:underline ml-1">Create one</a>
                </div>
            </div>

            <p class="text-center text-xs text-slate-500 mt-6">
                Protected by industry-standard encryption. We will never ask for your password or private keys.
            </p>
        </div>
    </main>

    <script src="JS/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Login successful. Redirecting to dashboard...');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>

</html>
