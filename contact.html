<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact – BYWEALTH INVEST</title>
    <meta name="description" content="Contact BYWEALTH INVEST support." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="CSS/style.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#0a0a0a', 'navy-light': '#141414', gold: '#d4af37' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>

<body class="bg-navy text-slate-100">

    <header class="sticky top-0 z-50 bg-navy/95 backdrop-blur border-b border-white/10">
        <div class="container flex items-center justify-between h-16">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gold flex items-center justify-center text-navy font-bold text-sm">BW
                </div>
                <span class="font-semibold hidden sm:inline">BYWEALTH <span class="text-gold">INVEST</span></span>
            </a>
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-sm text-slate-400 hover:text-gold">Home</a>
            </div>
        </div>
    </header>

    <main class="container py-12 md:py-16">
        <div class="max-w-2xl mx-auto">
            <div class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-bold mb-3">Contact Us</h1>
                <p class="text-slate-400">We’re here to help with account, deposit and platform questions.</p>
            </div>

            <div class="grid sm:grid-cols-2 gap-5 mb-10">
                <div class="card text-center">
                    <div class="text-2xl mb-2">✉️</div>
                    <p class="text-sm text-slate-400 mb-1">Support Email</p>
                    <a href="mailto:support@bywealthinvest.com"
                        class="text-gold hover:underline text-sm">support@bywealthinvest.com</a>
                </div>
                <div class="card text-center">
                    <div class="text-2xl mb-2">❓</div>
                    <p class="text-sm text-slate-400 mb-1">Help Centre</p>
                    <a href="faq.html" class="text-gold hover:underline text-sm">Visit FAQ</a>
                </div>
            </div>

            <div class="card">
                <h2 class="font-semibold mb-5">Send a Message</h2>
                <form id="contact-form" class="space-y-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1.5">Full Name</label>
                        <input type="text" required
                            class="w-full px-4 py-3 rounded-lg bg-navy border border-white/10 focus:border-gold outline-none transition text-sm" />
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1.5">Email Address</label>
                        <input type="email" required
                            class="w-full px-4 py-3 rounded-lg bg-navy border border-white/10 focus:border-gold outline-none transition text-sm" />
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1.5">Subject</label>
                        <select
                            class="w-full px-4 py-3 rounded-lg bg-navy border border-white/10 focus:border-gold outline-none transition text-sm">
                            <option>General Inquiry</option>
                            <option>Deposit Issue</option>
                            <option>Withdrawal Issue</option>
                            <option>Account Access</option>
                            <option>Security Concern</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1.5">Message</label>
                        <textarea rows="5" required
                            class="w-full px-4 py-3 rounded-lg bg-navy border border-white/10 focus:border-gold outline-none transition text-sm resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full btn-gold py-3.5">Send Message</button>
                </form>
            </div>

            <p class="text-center text-xs text-slate-500 mt-8">
                We aim to respond within 1–2 business days. For urgent security issues, mark the subject accordingly.
            </p>
        </div>
    </main>

    <script src="JS/main.js"></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Your message has been sent successfully. Our support team will be in touch shortly.');
        });
    </script>
</body>

</html>
